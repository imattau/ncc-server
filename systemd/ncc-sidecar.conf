# Install as /etc/systemd/system/ncc-sidecar.service.d/ncc-server.conf.
# The base unit is generated by ncc-sidecar's own installer.
[Unit]
Wants=network-online.target
After=network-online.target caddy.service

[Service]
SupplementaryGroups=caddy
UMask=0027
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/ncc-sidecar /opt/ncc-sidecar/certs
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=true
LockPersonality=true
# Node's V8 runtime needs executable memory for JIT; do not enable
# MemoryDenyWriteExecute for this service.
SystemCallFilter=@system-service

