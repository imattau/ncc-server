# Install as /etc/systemd/system/caddy.service.d/ncc-server.conf.
# This intentionally makes the packaged Caddy service serve this project's
# Caddyfile on a dedicated host.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
EnvironmentFile=/etc/ncc-server/ncc-server.env
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /etc/ncc-server/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/ncc-server/Caddyfile --force
Restart=on-failure
RestartSec=5s
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/caddy /var/log/caddy /var/log/ncc-server
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallFilter=@system-service

