version: "3.8"

services:
  tor:
    image: "${TOR_IMAGE:-ghcr.io/imattau/ncc-server-tor:latest}"
    network_mode: host
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /run/tor
    volumes:
      - "${TOR_DATA_DIR}:/var/lib/tor"
      - "${TOR_CONFIG_FILE}:/etc/tor/torrc:ro"
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sidecar:
    image: "${SIDECAR_IMAGE:-ghcr.io/imattau/ncc-server-sidecar:latest}"
    network_mode: host
    user: "${SIDECAR_UID}:${SIDECAR_GID}"
    environment:
      NODE_ENV: production
      NCC_SIDECAR_DB_PATH: /data/sidecar.db
      NCC_SIDECAR_ALLOW_REMOTE: "false"
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: "3000"
      # Lets the panel admin API refuse to remove the operator key from the
      # admin list. Every admin write is authorized per request by NIP-98.
      NCC_OPERATOR_PUBKEY: "${NCC_OPERATOR_PUBKEY:-}"
      # Canonical public origin the panel signs for, besides the request Host.
      # Covers the loopback listener and a proxy in front of Caddy.
      NCC_PANEL_PUBLIC_ORIGIN: "https://${PUBLIC_IPV4}:${ADMIN_PANEL_TLS_PORT}"
      # The panel's service controls call this companion container, which is
      # the only process with Docker access. Empty means the panel falls back
      # to health from probes and node logs only.
      NCC_NODE_AGENT_URL: "http://127.0.0.1:${NODE_AGENT_PORT:-3010}"
      NCC_NODE_AGENT_TOKEN: "${NODE_AGENT_TOKEN:-}"
      # npanel keeps its own users table; the sidecar mirrors node admins into
      # it through npanel's dashboard API. The dashboard routes by Host, so
      # the Host header must match npanel's configured dashboard_host.
      NCC_NPANEL_URL: "http://127.0.0.1:3200"
      NCC_NPANEL_HOST: "${PUBLIC_IPV4}"
      # Read-only npack catalogue for the App catalogue. The daemon runs in
      # the `npack` service; the sidecar only reads its Unix socket.
      NCC_NPACK_SOCKET: /run/npack/npackd.sock
      NCC_NPACK_OFFICIAL_PUBLISHER: "${NCC_NPACK_OFFICIAL_PUBLISHER:-}"
      CONTENT_PORT: "${CONTENT_PORT:-8080}"
    depends_on:
      - tor
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - "${SIDECAR_DATA_DIR}:/data"
      - "${SIDECAR_CERT_DIR}:/app/certs"
      - npack-run:/run/npack:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *bounded-logs

  # Companion process for the admin panel's container controls. It reuses the
  # sidecar image and runs a small, project-scoped Docker API instead of
  # giving the sidecar itself root-equivalent socket access. Only restart,
  # container state and recent logs are exposed, and only for containers
  # labelled com.docker.compose.project=ncc-bundle.
  node-agent:
    image: "${SIDECAR_IMAGE:-ghcr.io/imattau/ncc-server-sidecar:latest}"
    network_mode: host
    user: "0:0"
    command: ["node", "/app/node-agent.mjs"]
    environment:
      NCC_AGENT_HOST: 127.0.0.1
      NCC_AGENT_PORT: "${NODE_AGENT_PORT:-3010}"
      NCC_AGENT_TOKEN: "${NODE_AGENT_TOKEN:-}"
      NCC_COMPOSE_PROJECT: ncc-bundle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${NODE_AGENT_PORT:-3010}/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *bounded-logs

  # Read-only npack catalogue daemon for the admin panel's App catalogue.
  # npack publishes signed service descriptors on Nostr and their .npk bytes
  # on Blossom; this daemon only answers catalogue queries. It never installs
  # packages, never touches Docker, and is reached over a Unix socket volume
  # that the sidecar mounts read-only.
  npack:
    image: "${NPACK_IMAGE:-ghcr.io/imattau/ncc-server-npack:latest}"
    environment:
      NPACK_RELAYS: "${NPACK_RELAYS:-wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net}"
      NPACK_BLOSSOM_SERVERS: "${NPACK_BLOSSOM_SERVERS:-https://blossom.primal.net,https://cdn.satellite.earth}"
      NPACK_SOCKET: /run/npack/npackd.sock
    volumes:
      - npack-data:/data
      - npack-run:/run/npack
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/npack/npackd.sock"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *bounded-logs

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *bounded-logs

  relay:
    image: "${RELAY_IMAGE:-ghcr.io/imattau/ncc-server-relay:latest}"
    env_file:
      - "${DITTO_ENV_FILE}"
    environment:
      PORT: "13131"
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
    ports:
      - "127.0.0.1:13131:13131"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:13131/', { headers: { Accept: 'application/nostr+json' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *bounded-logs

  npanel:
    image: "${NPANEL_IMAGE:-ghcr.io/imattau/ncc-server-npanel:latest}"
    user: "${NPANEL_UID}:${NPANEL_GID}"
    entrypoint: ["/bin/sh", "/usr/local/bin/npanel-entrypoint"]
    environment:
      DASHBOARD_HOST: "${PUBLIC_IPV4}"
      NCC_PUBKEY: "${NCC_OPERATOR_PUBKEY:-}"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3200:3000"
      - "127.0.0.1:3201:3001"
    volumes:
      - "${NPANEL_DATA_DIR}:/data"
      - ./container/npanel/entrypoint:/usr/local/bin/npanel-entrypoint:ro
      - ./container/npanel/healthcheck:/usr/local/bin/healthcheck:ro
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *bounded-logs

  ditto-web:
    image: "${DITTO_WEB_IMAGE:-ghcr.io/imattau/ncc-server-ditto-web:latest}"
    ports:
      - "127.0.0.1:3210:8080"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *bounded-logs

  # The search backend is two services off one image (see
  # ncc-search/README.md "Two processes"):
  #
  #   search          read-only API (/search, /services, /status) -- the only
  #                   one with a published port; src/api.js
  #   search-crawler  discovery + fetch + index writes + prune; src/index.js
  #
  # They share the SQLite file over WAL: exactly one writer, many readers.
  # Keeping them apart is what stops a page parse or an index commit from
  # landing on a request's critical path.
  search:
    image: "${SEARCH_IMAGE:-ghcr.io/imattau/ncc-server-search:latest}"
    command: ["node", "src/api.js"]
    user: "${SEARCH_UID}:${SEARCH_GID}"
    environment:
      # No Nostr identity of any kind -- this process only subscribes to
      # relays (read, for NIP-50 live search) and serves its own SQLite/FTS5
      # index over plain HTTP. It never signs or publishes an event, unlike
      # sidecar/relay/npanel/ditto-web, which all use the operator identity
      # created by the first-start bootstrap. See container/search/
      # Containerfile's comment and ncc-search/README.md.
      NCC_SEARCH_RELAYS: "${SEARCH_RELAYS}"
      NCC_SEARCH_CORS_ORIGIN: "${SEARCH_CORS_ORIGIN}"
      # Displayed on /status only -- pruning is the crawler's job.
      NCC_SEARCH_DB_MAX_BYTES: "${SEARCH_DB_MAX_BYTES}"
      NCC_SEARCH_CRAWLER_URL: "http://search-crawler:7781"
    ports:
      - "127.0.0.1:3230:7780"
    volumes:
      - "${SEARCH_DATA_DIR}:/data"
    depends_on:
      # Startup ordering only: the API retries until the crawler has created
      # the database, so it does not need the crawler to be *healthy* first.
      - search-crawler
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7780/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *bounded-logs

  search-crawler:
    image: "${SEARCH_IMAGE:-ghcr.io/imattau/ncc-server-search:latest}"
    command: ["node", "src/index.js"]
    user: "${SEARCH_UID}:${SEARCH_GID}"
    environment:
      # Same read-only relay access as `search`, no published port: this is
      # the single writer of /data/ncc-search.db.
      NCC_SEARCH_RELAYS: "${SEARCH_RELAYS}"
      NCC_SEARCH_LEARN_RELAYS: "${SEARCH_LEARN_RELAYS:-true}"
      NCC_SEARCH_DB_MAX_BYTES: "${SEARCH_DB_MAX_BYTES}"
      # Private listener for the API (crawl health + NIP-50 ingest). Reachable
      # on the compose network only -- no `ports:` below.
      NCC_SEARCH_INTERNAL_HOST: "0.0.0.0"
      NCC_SEARCH_INTERNAL_PORT: "7781"
    volumes:
      - "${SEARCH_DATA_DIR}:/data"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7781/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *bounded-logs

  search-ui:
    image: "${SEARCH_UI_IMAGE:-ghcr.io/imattau/ncc-server-search-ui:latest}"
    environment:
      NCC_SEARCH_RELAYS: "${SEARCH_RELAYS}"
    ports:
      - "127.0.0.1:3220:8080"
    depends_on:
      - search
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *bounded-logs

  caddy:
    image: "${CADDY_IMAGE:-caddy:2.11.9-alpine}"
    network_mode: host
    group_add:
      - "${CADDY_GID}"
    environment:
      PUBLIC_IPV4: "${PUBLIC_IPV4}"
      NCC_OPERATOR_PUBKEY: "${NCC_OPERATOR_PUBKEY}"
      CONTENT_PORT: "${CONTENT_PORT}"
      CONTENT_TLS_PORT: "${CONTENT_TLS_PORT}"
      RELAY_TLS_PORT: "${RELAY_TLS_PORT}"
      DITTO_WEB_TLS_PORT: "${DITTO_WEB_TLS_PORT}"
      SEARCH_TLS_PORT: "${SEARCH_TLS_PORT}"
      NPANEL_TLS_PORT: "${NPANEL_TLS_PORT}"
      # Loopback-only HTTP listeners whose onion services map onion port 80
      # to one local port each. They are not published by Compose.
      TOR_NPANEL_PORT: "${TOR_NPANEL_PORT:-18045}"
      TOR_DITTO_WEB_PORT: "${TOR_DITTO_WEB_PORT:-18046}"
      TOR_SEARCH_PORT: "${TOR_SEARCH_PORT:-18047}"
      TOR_ADMIN_PORT: "${TOR_ADMIN_PORT:-18048}"
      ADMIN_PANEL_PORT: "${ADMIN_PANEL_PORT:-8081}"
      ADMIN_PANEL_TLS_PORT: "${ADMIN_PANEL_TLS_PORT:-8448}"
      CONTENT_ROOT: /srv/ncc-server/public
      WEB_CERT: /opt/ncc-sidecar/certs/2/server.crt
      WEB_KEY: /opt/ncc-sidecar/certs/2/server.key
      RELAY_CERT: /opt/ncc-sidecar/certs/3/server.crt
      RELAY_KEY: /opt/ncc-sidecar/certs/3/server.key
    volumes:
      - ./container/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./custom-services/caddy:/etc/caddy/custom:ro
      - "${CONTENT_ROOT}:/srv/ncc-server/public:ro"
      - "${SIDECAR_CERT_DIR}:/opt/ncc-sidecar/certs:ro"
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *bounded-logs

volumes:
  opensearch-data:
    external:
      name: "${OPENSEARCH_VOLUME}"
  caddy-data:
    name: "${CADDY_DATA_VOLUME:-ncc-bundle_caddy-data}"
  caddy-config:
    name: "${CADDY_CONFIG_VOLUME:-ncc-bundle_caddy-config}"
  npack-data:
    name: "${NPACK_DATA_VOLUME:-ncc-bundle_npack-data}"
  npack-run:
    name: "${NPACK_RUN_VOLUME:-ncc-bundle_npack-run}"
