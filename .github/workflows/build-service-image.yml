# Build and push a container image for an NCC service repository.
#
# Call this from the service repository's workflow, then pass the returned
# image and digest to publish-service-package.yml.
#
#   jobs:
#     build:
#       uses: imattau/ncc-server/.github/workflows/build-service-image.yml@v0.2.30
#       with:
#         image: ghcr.io/acme/hello-service
#         tag: 1.0.0
#       permissions:
#         contents: read
#         packages: write

name: Build NCC service image

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Dockerfile path
        type: string
        default: Dockerfile
      image:
        description: Registry repository, for example ghcr.io/acme/hello-service
        type: string
        required: true
      tag:
        description: Image tag
        type: string
        default: latest
      platforms:
        description: Comma-separated target platforms
        type: string
        default: linux/amd64,linux/arm64
      build_args:
        description: Newline-separated Docker build arguments
        type: string
        default: ''
      push:
        description: Push the image to the registry
        type: boolean
        default: true
    outputs:
      image:
        description: Image repository (without tag)
        value: ${{ jobs.build.outputs.image }}
      ref:
        description: Image reference with tag
        value: ${{ jobs.build.outputs.ref }}
      digest:
        description: Pushed manifest digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      ref: ${{ steps.meta.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalise image reference
        id: meta
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          case "$image" in
            */*) ;;
            *) echo "image must include a registry or namespace: $image" >&2; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "ref=$image:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.ref }}
          build-args: ${{ inputs.build_args }}
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### NCC service image"
            echo
            echo "- Reference: \`${{ steps.meta.outputs.ref }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
