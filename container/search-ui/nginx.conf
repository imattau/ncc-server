pid /tmp/nginx.pid;

events {}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	error_log /dev/stderr warn;
	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	server {
		listen 8080;
		server_name _;
		root /srv/ncc-search-ui;
		index index.html;
		add_header X-Content-Type-Options nosniff always;
		# CORS (including the OPTIONS preflight ncc-browser's webview sends
		# for same-origin JS/CSS) is handled once, centrally, by Caddy's
		# `cors_preflight` snippet in front of this container -- see
		# container/Caddyfile. Adding it here too would double up the
		# Access-Control-Allow-Origin header on every response, which the
		# Fetch spec treats as a FAILING check (it requires exactly one),
		# not a harmless duplicate -- found live, caught by comparing a
		# real response's raw headers rather than assuming curl's "looks
		# fine" output meant the browser would accept it too.
		#
		# Vite's own convention: everything under /assets/ is content-hashed
		# (the filename itself changes whenever the content does), so it can
		# be cached as aggressively as HTTP allows. index.html is excluded
		# on purpose -- it's what tells the browser which hashed assets are
		# current, so it must always be revalidated.
		location /assets/ {
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			try_files $uri =404;
		}
		location = /runtime-config.js {
			alias /tmp/ncc-search-runtime-config.js;
			add_header Cache-Control "no-cache" always;
		}
		location / {
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri/ /index.html;
		}
	}
}
