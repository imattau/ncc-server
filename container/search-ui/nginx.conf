pid /tmp/nginx.pid;

events {}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	error_log /dev/stderr warn;
	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	server {
		listen 8080;
		server_name _;
		root /srv/ncc-search-ui;
		index index.html;
		add_header X-Content-Type-Options nosniff always;
		# ncc-browser's webview sends a CORS preflight (OPTIONS, with
		# Access-Control-Request-*) for this page's own same-origin JS/CSS
		# assets -- found live: it treats the ncc:// page as cross-origin
		# from whatever it fetches subresources with, so a plain static
		# file server with no CORS handling answers OPTIONS with a bare
		# 405, the browser aborts the preflight, and the asset never loads
		# at all (console shows it as a failed/502-style request, not a
		# CORS error, since the preflight response itself has no CORS
		# headers for the browser to read a real reason from). This is a
		# public, unauthenticated, static bundle -- reflecting any origin
		# costs nothing security-wise.
		location / {
			# `add_header`'s "if" support only exists inside `location`
			# context, not directly inside `server` -- this has to live
			# here, not alongside the plain add_header above.
			add_header Access-Control-Allow-Origin '*' always;
			if ($request_method = OPTIONS) {
				add_header Access-Control-Allow-Origin '*' always;
				add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
				add_header Access-Control-Allow-Headers '*' always;
				add_header Content-Length 0;
				return 204;
			}
			try_files $uri $uri/ /index.html;
		}
	}
}
