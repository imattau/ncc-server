pid /tmp/nginx.pid;

events {}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	error_log /dev/stderr warn;
	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	server {
		listen 8080;
		server_name _;
		root /srv/ditto;
		index index.html;
		add_header X-Content-Type-Options nosniff always;
		# Vite's own convention: everything under /assets/ is content-hashed
		# (the filename itself changes whenever the content does), so it can
		# be cached as aggressively as HTTP allows -- the browser never
		# needs to even ask whether a given hash is still current. Without
		# this, nginx sent no Cache-Control at all, so every single asset
		# on every single page load (dozens of them) cost at least a
		# conditional-GET round-trip, not a true cache hit -- found while
		# tracing a repeat-visit delay that persisted even after the
		# origin-leak fix. index.html (and the unhashed theme.js) are
		# deliberately excluded: they're what tells the browser which
		# hashed assets are current, so they must always be revalidated.
		location /assets/ {
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			try_files $uri =404;
		}
		location / {
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri/ /index.html;
		}
	}
}
